[program:tasks-reverb]
command=php /var/www/html/artisan reverb:start
process_name=%(program_name)s
; Exactly one process unless REVERB_SCALING_ENABLED=true (Redis-backed pub/sub
; -- see .env.production.example) so multiple processes can share connection
; state. Don't raise numprocs above 1 until that's actually turned on.
numprocs=1
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/tasks/reverb.log
; reverb:start needs longer than the default 10s to drain existing WebSocket
; connections on shutdown/restart.
stopsignal=TERM
stopwaitsecs=30
