name: CI

# Runs the test suite on every pull request (whatever its base branch, so stacked
# PRs are covered) and on pushes to the trunk. The suite uses in-memory SQLite
# from phpunit.xml and fakes Vite, so no database or asset build is needed.
on:
  # Called by deploy.yml as the release gate.
  workflow_call: {}
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      # .env must exist BEFORE composer install: package:discover boots the app,
      # and with no .env the broadcaster defaults to reverb with null credentials.
      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          BROADCAST_CONNECTION: log
        run: ./vendor/bin/phpunit --colors=never

  postgres:
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: tasks
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
          extensions: pdo_pgsql, pgsql, mbstring, intl, bcmath, curl

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      # phpunit.xml forces in-memory SQLite, so the copy this job uses points at the service instead.
      - name: Point the tests at PostgreSQL
        run: |
          sed -e 's/name="DB_CONNECTION" value="sqlite"/name="DB_CONNECTION" value="pgsql"/' \
              -e 's/name="DB_DATABASE" value=":memory:"/name="DB_DATABASE" value="tasks_test"/' phpunit.xml > phpunit.pg.xml
          grep -q 'value="pgsql"' phpunit.pg.xml && grep -q 'value="tasks_test"' phpunit.pg.xml

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: tasks
          DB_PASSWORD: tasks
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          BROADCAST_CONNECTION: log
        run: ./vendor/bin/phpunit -c phpunit.pg.xml --colors=never

  browser:
    name: Browser tests (Dusk)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # .env must exist BEFORE composer install: package:discover boots the app.
      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/dusk.sqlite
          sed -i "s|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|" .env
          sed -i "s|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|" .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=${GITHUB_WORKSPACE}/database/dusk.sqlite|" .env
          sed -i "s|^BROADCAST_CONNECTION=.*|BROADCAST_CONNECTION=null|" .env
          sed -i "s|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|" .env
          sed -i "s|^CACHE_STORE=.*|CACHE_STORE=file|" .env
          sed -i "s|^SESSION_DRIVER=.*|SESSION_DRIVER=file|" .env

      - name: Install dependencies and build the assets
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          php artisan key:generate
          php artisan migrate --force

      - name: ChromeDriver for the installed Chrome
        run: php artisan dusk:chrome-driver --detect

      - name: Serve the app
        run: PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=127.0.0.1 --port=8000 --no-reload > storage/logs/dusk-serve.log 2>&1 &

      - name: Browser tests
        run: php artisan dusk

      - name: Keep screenshots, console output and logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-failure
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            storage/logs
          retention-days: 7
